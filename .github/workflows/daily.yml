name: Daily PulseScope Discovery and Publish
on:
  schedule:
    - cron: '45 2 * * *' # 08:15 Asia/Kolkata daily; GitHub schedule can be delayed
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Discover new public headlines
        run: python scripts/discover_news.py
      - name: Validate archive
        run: python -m json.tool data/briefings.json > /dev/null
      - name: Commit cumulative archive when changed
        run: |
          if ! git diff --quiet -- data/briefings.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/briefings.json
            git commit -m "Update PulseScope daily research leads"
            git push
          else
            echo 'No archive changes'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
