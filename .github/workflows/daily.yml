name: Daily PulseScope Trusted-Source Audit
on:
  schedule:
    - cron: '45 2 * * *' # 08:15 IST; GitHub schedule may be delayed
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out dashboard and archive
        uses: actions/checkout@v4
      - name: Check JSON structure
        run: python -m json.tool data/briefings.json > /dev/null
      - name: Block unknown source domains and redirect links
        run: python scripts/validate_sources.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy safe archive
        id: deployment
        uses: actions/deploy-pages@v4
