name: Daily PulseScope Safe-Source Updates
on:
  schedule:
    - cron: '45 2 * * *' # Approximately 08:15 IST; GitHub schedules may run late
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_update.py'
      - '.github/workflows/daily.yml'
permissions:
  contents: write
concurrency:
  group: pulsescope-daily-update
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest approved archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch direct PubMed and FDA records
        run: python scripts/auto_update.py
      - name: Validate all published source links
        run: python scripts/validate_sources.py
      - name: Check JSON files
        run: |
          python -m json.tool data/briefings.json > /dev/null
          python -m json.tool data/status.json > /dev/null
      - name: Commit daily check and any genuinely new records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/briefings.json data/status.json
          if git diff --cached --quiet; then
            echo 'No changes to publish'
          else
            git commit -m 'Update PulseScope official-source daily archive and check status'
            git push origin HEAD:main
          fi
